steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nn-analyze/nn-analyze:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nn-analyze/nn-analyze:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nn-analyze/nn-analyze'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nn-analyze-service'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nn-analyze/nn-analyze:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'CONFIGURED_AUTH_BEARER=${_CONFIGURED_AUTH_BEARER},FIRESTORE_PROJECT_ID=$PROJECT_ID'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/nn-analyze/nn-analyze:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/nn-analyze/nn-analyze:latest'

timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET